<!DOCTYPE html>

<html>
<head>
    <title>Dino Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

```
<h1>🦖 Dino Game</h1>

<div id="game">
    <div id="dino">🦖</div>
</div>

<div id="stats">
    <div class="stat-row">
        <label>Hunger</label>
        <div class="bar-outer" id="hunger-bar"></div>
    </div>
    <div class="stat-row">
        <label>Sleep</label>
        <div class="bar-outer" id="sleep-bar"></div>
    </div>
    <div class="stat-row">Size level: <span id="size-display">1</span></div>
    <div class="stat-row">Time: <span id="time-indicator">☀️ Day</span></div>
    <div class="stat-row">Status: <span id="status-indicator">Awake (press E to sleep)</span></div>
</div>

<div id="message"></div>

<script src="game.js"></script>
```

</body>
</html>
